<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f0e7">
  <title>Учебные часы</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="heading">
      <span class="eyebrow">Учимся определять время</span>
      <h1>Часы</h1>
      <p>Передвигай стрелки или выставь время цифрами.</p>
    </header>
    <section class="clock-panel" aria-label="Учебные часы">
      <svg id="clock-face" class="clock-face" viewBox="0 0 440 440" role="img" aria-label="Циферблат со стрелками">
        <circle class="face" cx="220" cy="220" r="184" />
        <g id="minute-marks" aria-hidden="true"></g>
        <g id="hour-marks" aria-hidden="true"></g>
        <g id="minute-labels" aria-hidden="true"></g>
        <g id="hour-labels" aria-hidden="true"></g>
        <line
          id="hour-hand"
          class="hand hour-hand"
          x1="220"
          y1="236"
          x2="220"
          y2="125"
          role="img"
          aria-label="Часовая стрелка"
        />
        <line
          id="minute-hand"
          class="hand minute-hand"
          x1="220"
          y1="240"
          x2="220"
          y2="75"
          role="img"
          aria-label="Минутная стрелка"
        />
        <line
          id="second-hand"
          class="second-hand"
          x1="220"
          y1="249"
          x2="220"
          y2="61"
          visibility="hidden"
          aria-hidden="true"
        />
        <circle class="pin" cx="220" cy="220" r="9" />
      </svg>
      <div id="time-controls" class="time-controls">
        <label for="time-input">Время</label>
        <div class="time-entry">
          <input
            id="time-input"
            type="text"
            inputmode="numeric"
            autocomplete="off"
            spellcheck="false"
            pattern="([01][0-9]|2[0-3]):[0-5][0-9]"
            value="10:10"
            placeholder="ЧЧ:ММ"
            aria-describedby="time-hint time-message"
          >
          <button id="set-time" type="button">Выставить</button>
        </div>
        <small id="time-hint" class="time-hint">ЧЧ:ММ · от 00:00 до 23:59</small>
      </div>
      <p id="time-message" class="status" aria-live="polite">Потяни за любую стрелку.</p>
    </section>
    <section class="settings" aria-label="Настройки часов">
      <div class="setting-row" role="group" aria-labelledby="dial-style-label">
        <span id="dial-style-label" class="setting-title">Подписи часов:</span>
        <div class="choice-row">
          <label>
            <input type="radio" name="dial-style" value="arabic" checked>
            <span>1 2 3</span>
          </label>
          <label>
            <input type="radio" name="dial-style" value="roman">
            <span>I II III</span>
          </label>
          <label>
            <input type="radio" name="dial-style" value="none">
            <span>Без чисел</span>
          </label>
        </div>
      </div>
      <div class="setting-row">
        <label class="setting-title" for="show-minutes">Минуты по кругу:</label>
        <input id="show-minutes" type="checkbox">
      </div>
      <div class="setting-row">
        <label class="setting-title" for="live-time">Живое время:</label>
        <input id="live-time" type="checkbox">
      </div>
      <div class="setting-row">
        <label class="setting-title" for="sync-mode">Связанные стрелки:</label>
        <input id="sync-mode" type="checkbox" checked>
      </div>
      <div class="setting-row">
        <label class="setting-title" for="show-time">Показывать цифровое время:</label>
        <input id="show-time" type="checkbox" checked>
      </div>
    </section>
  </main>
</body>
</html>
